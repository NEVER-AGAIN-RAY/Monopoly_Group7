infoIntro1=This is a card game about grabbing properties. The first player to lay down 3 complete sets of different colors wins.
infoIntro2=You hold three kinds of cards: money (to pay), property (to build sets), and action cards (rent, steals, counters, and other effects).
infoIntro3=On your turn you do just three things: draw 2 cards, play up to 3 cards (bank money / lay down property / use an action), then end your turn.
infoIntro4=To practice, pick "Human vs AI" on the screen and hit start for a solo game; to play with friends, use "Live Match" to join the same room.
infoIntroDetail=Table layout: the screen has three parts. Your hand is at the bottom; the money and property you play go to "My Board"; opponents' assets show up top. Your goal is to turn hand cards into properties in front of you and complete 3 sets before anyone else.\n\nWhat each card type does: Money pays rent and fines; bank it to save up. Property has a color, and collecting enough of one color completes a set (different colors need a different count, 2-4 cards, printed on the card). Wild property can stand in for any color (or its two printed colors) to fill a gap. Action cards draw, charge rent, collect debt, steal a whole set, trade cards, add buildings to raise rent, or use Just Say No to cancel an action aimed at you.\n\nHow to start as a beginner: choose "Human vs AI", connect, and press start. In the first few turns, lay down properties to build sets, and keep some money in the bank so you can pay when someone charges you rent.\n\nA reminder: the game is won by completing 3 sets first, not by holding the most cash. Saving money without laying down property will not win.
infoRules1=How you win: be the first to complete 3 full property sets of different colors on your board. A set size depends on color: most need 3, Brown/Dark Blue/Utility need 2, Railroad needs 4.
infoRules2=Each turn has three steps: (1) click "Draw 2 Cards"; (2) play up to 3 cards; (3) click "End Turn". If you hold more than 7 cards at turn end, discard down to 7.
infoRules3=How to play a card: click a card in your hand, the buttons below light up, then click "Deposit", "Deploy Property", or "Play Action". You can also double-click a card to play it fast.
infoRules4=When you are targeted: if someone charges you rent or steals from you, a response window pops up. You can pay, or play a Just Say No from your hand to cancel that action.
infoRulesDetail=Your first turn, step by step: (1) When it is your turn, click "Draw 2 Cards" on the right. (2) Look at your hand: select a property and click "Deploy Property" to lay it down; select a money card and click "Deposit" to save it; to use an action card, select it and click "Play Action". You may play up to 3 cards per turn. (3) When done, click "End Turn". If you hold too many cards (over 7), you will be asked to discard first.\n\nWhat counts as a complete set: collect the required number of one color. Brown, Dark Blue, and Utility need 2; Railroad needs 4; every other color needs 3 (the card shows how many). Complete 3 sets of different colors to win. The game checks for a win at end turn and before you draw on your next turn.\n\nMoney and paying: when you must pay (rent, debt, birthday), you can only pay from your bank and property areas, never straight from your hand, and there is no change for overpayment, so don't use a big bill to cover a small charge. Otherwise, bank your money and spare action cards to build up a cushion.\n\nBuildings on a full set: once a set is complete you can add a House (+3M rent) or Hotel (+7M rent) to charge more; but Railroad and Utility sets cannot take a House or Hotel.\n\nCommon action cards: Rent charges an opponent for one of your colors; Debt Collector makes one opponent pay you 5M; Birthday makes everyone else give you 2M; Sly Deal steals a single card; Forced Deal swaps a card with an opponent; Deal Breaker takes a whole complete set from an opponent (the strongest, watch out); Double Rent doubles your next rent; Pass Go lets you draw 2 more cards right away.\n\nHow countering works: when an action targets you, play "Just Say No" to cancel it; the other player may answer with their own "Just Say No" to cancel your cancel, and so on, until one side has none left.
infoGuide1=Start the Java WebSocket backend first, then launch the JavaFX client.
infoGuide2=The default endpoint is ws://localhost:8025/ws; after connecting, the status shows connected.
infoGuide3=For solo HVM, click Start Game. For multiplayer PvP, create or join the same room.
infoGuide4=Multiplayer clients need the same session or room, but different player IDs and nicknames.
infoGuideDetail=Start backend: from the project root, run mvn -q exec:java. Keep that terminal open after it prints ws://localhost:8025/ws.\n\nStart client: open another terminal and run mvn javafx:run. Confirm the server URL is ws://localhost:8025/ws, then click Connect.\n\nHuman vs machine: choose HVM, set player count and AI difficulty, then click Start Game. You usually use human-1 and AI seats are filled automatically.\n\nMultiplayer: only one machine should run the backend (mvn -q exec:java as the server); the other players must NOT start their own server. Instead, change the "Connect" address to ws://<server-machine-LAN-IP>:8025/ws (find the server IP by running ipconfig getifaddr en0 on macOS or ipconfig on Windows on the server machine). Using localhost on every client means each connects to its own server and rooms will not be shared. Once all clients point to the same server, one can create a room and the others select that room and join. Manual sessions also work when all clients use the same session ID but different player IDs.\n\nMode differences: PvP requires humans to act on separate clients. LLM uses DeepSeek-controlled seats. CUSTOM accepts seat lists such as human,human,llm,llm or hard,hard,lookahead,lookahead.\n\nConnection checks: if connection fails, make sure the backend terminal is still running, port 8025 is not held by an old process, the firewall is not blocking it, and the URL ends with /ws.

