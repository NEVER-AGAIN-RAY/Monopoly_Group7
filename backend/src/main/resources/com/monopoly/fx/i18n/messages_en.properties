infoIntro1=This is fast Monopoly Deal: no board movement, just hand cards, bank, and property sets.
infoIntro2=The goal is simple: complete 3 full property sets of different colors first.
infoIntro3=You can bank money, deploy properties, charge rent, steal sets, trade properties, and counter with Just Say No.
infoIntro4=HVM is good for solo practice; PvP and the room lobby let multiple clients join one game.
infoIntroDetail=Game areas: your hand is at the bottom. Select a card, then deposit it, deploy property, play an action, or discard. Your bank and properties are shown on your board, and opponents are shown above.\n\nCard types: money pays bills; properties build sets; wild properties fill colors; action cards draw, charge rent, collect debt, steal, trade, add House or Hotel, or counter another player.\n\nBeginner path: start with HVM, connect, and click Start Game. Deploy properties early, keep some money in the bank for rent, and watch for Deal Breaker, Sly Deal, Forced Deal, and Just Say No when an opponent is close to a third set.\n\nWinning tempo: do not only bank money. Monopoly Deal is about asset tempo: complete sets improve rent pressure and move you toward victory.
infoRules1=Draw 2 cards each turn; if your hand is empty at turn start, draw 5 instead.
infoRules2=During the play phase, play up to 3 cards; at turn end, discard down to 7 cards if needed.
infoRules3=Money and action cards may be banked; property cards go to your property area and form color sets.
infoRules4=Rent, debt, and steal actions open a response window where the target may play Just Say No.
infoRulesDetail=Victory: the first player to complete 3 full property sets of different colors wins. This implementation checks victory at end turn and before a player draws on their turn.\n\nTurn flow: draw cards, play up to 3 actions, discard down to 7 if over the hand limit, then end the turn.\n\nBank and payment: money cards and banked action cards can pay rent, debt, and birthday charges. Payment comes only from bank and property areas, never directly from hand, and there is no change for overpayment.\n\nProperties and buildings: properties complete color sets. Wild properties choose a color when deployed. House adds +3M and Hotel adds +7M; Railroad and Utility sets cannot receive House or Hotel.\n\nActions and counters: Rent, Debt Collector, Birthday, Sly Deal, Forced Deal, Deal Breaker, and similar actions change assets or demand payment. Just Say No can cancel an action aimed at you and may create a counter chain.\n\nRent: owning at least 1 property of a color lets you charge rent for that color. Rent follows the color tier table, House and Hotel add bonuses, and Double Rent doubles that rent charge.
infoGuide1=Start the Java WebSocket backend first, then launch the JavaFX client.
infoGuide2=The default endpoint is ws://localhost:8025/ws; after connecting, the status shows connected.
infoGuide3=For solo HVM, click Start Game. For multiplayer PvP, create or join the same room.
infoGuide4=Multiplayer clients need the same session or room, but different player IDs and nicknames.
infoGuideDetail=Start backend: from the project root, run mvn -q exec:java. Keep that terminal open after it prints ws://localhost:8025/ws.\n\nStart client: open another terminal and run mvn javafx:run. Confirm the server URL is ws://localhost:8025/ws, then click Connect.\n\nHuman vs machine: choose HVM, set player count and AI difficulty, then click Start Game. You usually use human-1 and AI seats are filled automatically.\n\nMultiplayer: every player connects to the same backend. One client can create a room, and the others select that room and join. Manual sessions also work when all clients use the same session ID but different player IDs.\n\nMode differences: PvP requires humans to act on separate clients. LLM uses DeepSeek-controlled seats. CUSTOM accepts seat lists such as human,human,llm,llm or hard,hard,lookahead,lookahead.\n\nConnection checks: if connection fails, make sure the backend terminal is still running, port 8025 is not held by an old process, the firewall is not blocking it, and the URL ends with /ws.

