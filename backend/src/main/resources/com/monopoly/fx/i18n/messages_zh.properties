infoIntro1=这是一个抢房产的纸牌游戏。谁先在自己面前摆出 3 套不同颜色的完整房产，谁就赢。
infoIntro2=你手里有三种牌：钱牌（用来付钱）、房产牌（用来凑套）、行动牌（收租、偷牌、反击等特殊效果）。
infoIntro3=轮到你时，先摸 2 张牌，再最多打出 3 张牌（存钱、摆房产或用行动牌），最后结束回合。
infoIntro4=想先练手，选界面上的「人机对战」点开始即可单人开打；想和朋友一起玩，用「真人匹配」进同一个房间。
infoIntroDetail=【桌面布局】屏幕分三块：最下面是你的手牌；你打出的钱和房产摆在「我的置牌区」；对手的资产显示在上方。目标是把手牌摆成自己面前的房产，比对手更快集齐 3 套。\n\n【三种牌的用处】钱牌：被收租或罚款时用来支付，平时先存进银行。房产牌：每张带一个颜色，把同色的牌凑够数量就算完成一套（不同颜色需要的张数不同，2～4 张，牌面上有标注）。万能房产：可以当任意颜色（或牌上印的两种颜色）使用，用来补缺口。行动牌：摸牌、收租、讨债、偷整套、和人换牌、给整套加盖房子涨租金，或者用 Just Say No 取消别人针对你的行动。\n\n【新手开局建议】选「人机对战」，连接后点开始。前几回合多把房产摆出来凑套，同时在银行里留一些钱，免得被收租时拿不出来。\n\n【一点提醒】这局的胜负只看谁先凑齐 3 套房产。光存钱、不摆房产是赢不了的。
infoRules1=获胜条件：第一个在自己置牌区集齐 3 套不同颜色的完整房产。一套需要几张看颜色：多数颜色 3 张，棕色、深蓝、公共 2 张，铁路 4 张。
infoRules2=每回合三步：① 点「摸 2 张牌」补牌；② 最多打出 3 张牌；③ 点「结束回合」。回合结束时手牌超过 7 张，要弃到 7 张。
infoRules3=怎么出牌：先点选一张手牌，下方按钮会亮起，再点「存入银行」「部署房产」或「打出行动牌」。也可以直接双击手牌快速出。
infoRules4=被别人针对时：对方收你租金或偷你牌时会弹出响应窗口，你可以付牌，也可以打出手里的 Just Say No 直接取消这次行动。
infoRulesDetail=【第一个回合照着做】① 轮到你，先点右侧「摸 2 张牌」。② 看手牌：是房产就选中它点「部署房产」摆到面前；是钱牌就选中点「存入银行」存起来；想用行动牌就选中点「打出行动牌」。一回合最多出 3 张。③ 出完点「结束回合」交给对手。手牌超过 7 张时会让你先弃牌。\n\n【怎么算完整一套】把同一种颜色凑够规定张数就是一套：棕色、深蓝、公共事业各 2 张，铁路 4 张，其余颜色 3 张（牌面会标注需要几张）。集齐 3 套不同颜色即获胜，系统会在你结束回合、以及下次轮到你摸牌前自动判定。\n\n【钱怎么用、怎么赔】需要赔钱时（被收租、被讨债、生日礼金），只能从「银行」和「房产区」拿牌支付，不能直接用手牌，而且多付不找零，所以别用大额牌去赔小钱。平时把钱牌和暂时用不到的行动牌存进银行攒厚一些。\n\n【凑齐一套后能加盖】完成一整套后，可以给它加「房屋」（租金 +3M）或「旅馆」（租金 +7M）收更多租；但铁路和公共事业这两类不能加盖。\n\n【常见行动牌】收租 Rent：向对手收某个颜色的租金；讨债 Debt Collector：指定一名对手付你 5M；生日 Birthday：其他每人给你 2M；偷牌 Sly Deal：偷对手一张单独的牌；强换 Forced Deal：和对手交换一张牌；拆套 Deal Breaker：抢走对手一整套完整房产（最强，要小心）；双倍租金 Double Rent：让这次收的租金翻倍；过路费 Pass Go：立刻再摸 2 张牌。\n\n【反制】行动牌指向你时，可以打出 Just Say No 取消它；对方也可能再打一张 Just Say No 把你的反制取消，来回拉锯，直到一方没有 Just Say No 为止。
infoGuide1=联机不用每个人都开服务器：只要一台电脑当主机跑服务器，其他人连到这台就行。
infoGuide2=主机在项目目录运行 mvn -q exec:java，看到 ws://localhost:8025/ws 就是开好了，这个终端整局都别关。
infoGuide3=每个人都运行 mvn javafx:run 打开游戏。主机地址填 ws://localhost:8025/ws，其他人填 ws://主机IP:8025/ws，再点「连接」。
infoGuide4=连上后一个人填昵称点「创建房间」，其他人在「房间列表」里双击它加入；房主把席位排好，点「开始房间」就开打。
infoGuideDetail=【先说清楚谁当主机】联机时不是每个人都开服务器，而是只有一台电脑当「主机」。主机负责跑服务器，其他人的游戏都连到主机这一台上。所以先商量好谁当主机，挑网络稳一点的那台，并且保证大家连的是同一个 Wi-Fi 或同一个热点。\n\n【主机：把服务器开起来】主机在项目根目录运行 mvn -q exec:java。终端打印出 ws://localhost:8025/ws 就说明服务器起来了，这个终端整局都别关——关了大家会一起掉线。\n\n【主机：查一下自己的局域网 IP】别人要连主机，得知道主机的 IP。主机再开一个终端：Mac 上运行 ipconfig getifaddr en0，Windows 上运行 ipconfig 看「IPv4 地址」，会得到类似 192.168.1.7 这样一串，把它发到群里。\n\n【所有人：打开游戏并连接】每个人（包括主机自己）都运行 mvn javafx:run 打开游戏窗口。右上角「连接」那一栏填地址：主机自己填 ws://localhost:8025/ws；其他人填 ws://主机IP:8025/ws（把「主机IP」换成上一步那串数字，比如 ws://192.168.1.7:8025/ws）。填完点「连接」，状态显示「已连接」就成功了。注意：别所有人都填 localhost，那样每个人连的都是自己的电脑，互相看不到房间。\n\n【一个人建房，其他人进房】连上之后，下面会出现「房间列表」。先找一个人当房主：填好「昵称」，点「创建房间」，他就进了「等待厅」。这时其他人的「房间列表」里会自动冒出这个房间，每个人填好自己的昵称（昵称不能和别人重复，重复了会弹提示），在列表里双击这个房间就加进去了，也可以选中后点「加入房间」。「房间号」用默认的就行，它只是房间的名字，加入的人不用手动填，双击会自动带上。\n\n【房主排席位，然后开局】房主在「等待厅」给每个「席位」选身份：是真人就选「真人」，再挑一个已经进房的昵称；想加电脑玩家就选对应的 AI 类型；用不到的位子留「空位」。至少要有 2 个有效席位、并且至少 1 个真人，「开始房间」才点得动。排好后房主点「开始房间」，所有人一起进牌桌。\n\n【连不上怎么办】挨个排查：主机的服务器终端是不是还在跑、有没有被关掉；大家是不是都在同一个 Wi-Fi 或热点下；其他人填的是不是主机IP（而不是 localhost），地址结尾有没有 /ws。如果都对还是连不上，多半是主机的防火墙拦了 8025 端口，或者这个端口被别的程序占用了——换台机器当主机，或者把服务器关掉重开再试。\n\n【只想一个人先练手】不用管联机，直接在左边「人机对战」设好人数和 AI 难度，点「开始人机对战」就能单人开打。

