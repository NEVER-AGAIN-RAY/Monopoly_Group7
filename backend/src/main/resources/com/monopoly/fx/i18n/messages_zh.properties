infoIntro1=这是 Monopoly Deal 的 JavaFX 牌桌，连接同一个 Java WebSocket 后端。
infoIntro2=HVM 是人机模式，PVP 和房间大厅可让多个客户端加入同一个会话。
infoIntro3=目标是先集齐 3 套完整房产。
infoRules1=每回合自动摸牌，出牌阶段最多打出 3 张牌。
infoRules2=现金和行动牌可以存入银行；房产牌部署到自己的房产区。
infoRules3=收租、讨债、偷牌等行动会进入响应窗口，被指向的玩家可使用 Just Say No。
infoGuide1=先在一个终端运行 mvn -q exec:java 启动后端。
infoGuide2=JavaFX 默认连接 ws://localhost:8025/ws。
infoGuide3=多人 PVP 时，所有客户端使用相同会话 ID，不同玩家 ID。

