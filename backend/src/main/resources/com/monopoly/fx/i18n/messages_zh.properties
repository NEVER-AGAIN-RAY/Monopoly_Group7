infoIntro1=这是一局快节奏 Monopoly Deal：不用走棋盘，只用手牌、银行和房产区决胜。
infoIntro2=目标很明确：先在自己面前集齐 3 套不同颜色的完整房产。
infoIntro3=你可以存钱、部署房产、收租、抢整套、换地，也可以用 Just Say No 反制。
infoIntro4=HVM 适合单人练习，PVP 和房间大厅适合多个客户端加入同一局。
infoIntroDetail=【牌桌区域】手牌在底部，先选牌再选择存入银行、部署房产、打出行动牌或弃牌；自己的房产和银行显示在下方置牌区，对手资产显示在上方。\n\n【牌类概览】现金牌主要用于支付；房产牌用于凑套；万能房产可补颜色；行动牌负责摸牌、收租、讨债、偷牌、换牌、加盖房屋/旅馆或反制对手。\n\n【上手路线】新玩家可以先选 HVM，连接后直接开始游戏。优先部署房产凑套，银行里保留一些现金防止被收租；当对手快要完成第 3 套时，要特别注意 Deal Breaker、Sly Deal、Forced Deal 和 Just Say No。\n\n【获胜节奏】不要只存钱。Monopoly Deal 的核心是资产节奏：越早凑完整套，收租越强，也越接近胜利。
infoRules1=每回合摸 2 张；如果回合开始时手牌为空，则摸 5 张。
infoRules2=出牌阶段最多打出 3 张牌，回合结束时手牌超过 7 张需要弃到 7 张。
infoRules3=现金和行动牌可以存入银行；房产牌部署到自己的房产区并按颜色凑套。
infoRules4=收租、讨债、偷牌等行动会进入响应窗口，被指向的玩家可使用 Just Say No。
infoRulesDetail=【胜利条件】率先集齐 3 套不同颜色完整房产的玩家获胜。本实现会在结束回合和轮到玩家摸牌前检查胜利。\n\n【回合流程】摸牌阶段获得新牌；出牌阶段最多执行 3 次出牌动作；如果手牌超过 7 张，必须弃牌；最后结束回合交给下一名玩家。\n\n【银行与支付】现金牌和已存入银行的行动牌可用于支付租金、讨债和生日礼金。支付只能从银行区和财产区拿牌，不能从手牌直接支付，并且多付不找零。\n\n【房产与建筑】房产按颜色组成完整套；万能房产在部署时声明颜色。房屋提供 +3M，旅馆提供 +7M；铁路和公共事业不能加盖房屋或旅馆。\n\n【行动与反制】Rent、Debt Collector、Birthday、Sly Deal、Forced Deal、Deal Breaker 等行动会改变资产或要求付款。Just Say No 可以取消针对你的行动，也可能形成双方继续反制的响应链。\n\n【租金】拥有某颜色至少 1 张房产即可收租；租金按该颜色牌面阶梯计算，房屋/旅馆会叠加加值，Double Rent 会让该次租金翻倍。
infoGuide1=先启动 Java WebSocket 后端，再启动 JavaFX 客户端。
infoGuide2=默认地址是 ws://localhost:8025/ws，连接成功后状态会显示“已连接”。
infoGuide3=单机 HVM 直接点“开始游戏”；多人 PVP 建议使用房间列表创建或加入同一个房间。
infoGuide4=多人客户端需要相同会话 ID 或同一房间，不同玩家 ID / 昵称。
infoGuideDetail=【启动后端】在项目根目录运行 mvn -q exec:java。看到 ws://localhost:8025/ws 后保持终端运行。\n\n【启动客户端】另开终端运行 mvn javafx:run。确认服务器地址为 ws://localhost:8025/ws，点击“连接”。\n\n【人机模式】选择 HVM，设置人数和 AI 难度，点击“开始游戏”即可。你通常使用 human-1，AI 会自动补齐席位。\n\n【多人模式】所有玩家连接同一个后端。可以在房间列表中创建房间，其他客户端选择同一房间加入；也可以手动使用相同会话 ID，但每个客户端必须填写不同玩家 ID。\n\n【模式区别】PVP 需要真人分别操作；LLM 会让 DeepSeek 席位自动决策；CUSTOM 可用 human,human,llm,llm 或 hard,hard,lookahead,lookahead 这类席位配置。\n\n【排查连接】如果连接失败，先确认后端终端仍在运行、端口 8025 没被旧进程占用、防火墙没有拦截，并检查地址是否包含 /ws。

